# Deliberately outside the root workspace: this crate cross-compiles for
# Android with its own lockfile and target settings.
[workspace]

[package]
name = "menhir-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Obelisk Menhir — sovereign text channels over Nostr, with one-click Tor hosting"
repository = "https://github.com/obelisk-app/obelisk-menhir"

[lib]
name = "menhir_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hosting + onion bridging are desktop-only: the Android app is a pure client.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
menhir-core = { path = "../../crates/menhir-core", features = ["client"] }
menhir-relay = { path = "../../crates/menhir-relay" }
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
