# Deliberately outside the root workspace: this crate cross-compiles for
# Android with its own lockfile and target settings.
[workspace]

[package]
name = "menhir-app"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Obelisk Menhir — sovereign text channels over Nostr, with one-click Tor hosting"
repository = "https://github.com/obelisk-app/obelisk-menhir"

[lib]
name = "menhir_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# rustls 0.23 refuses to pick a crypto backend when more than one is present
# in the dependency graph, and *panics* on first use. A panic inside a Tauri
# command never resolves its promise, so the UI just hangs — see run().
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Unread badges are only half of it: people need to be told when they are
# spoken to. Works on desktop and Android from the same call.
tauri-plugin-notification = "2"

# Hosting is desktop-only (Android would kill a long-running server anyway),
# so the relay, the managed `tor` process, and the Nostr core live here.
# Keeping menhir-core off mobile also keeps secp256k1's C sources out of the
# Android build, which would otherwise need a cross C toolchain.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
menhir-core = { path = "../../crates/menhir-core", features = ["client"] }
menhir-relay = { path = "../../crates/menhir-relay" }
tokio-socks = "0.5"

# Reaching .onion servers works on every platform, by different means:
# desktop drives the system Tor over SOCKS, mobile embeds arti (Tor in Rust)
# in-process so there is nothing to install.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# static-sqlite: arti's directory cache is sqlite-backed and the NDK ships no
# libsqlite3 to link against, so compile it in. No "compression": it pulls in
# zstd/lzma C sources for a bandwidth saving we don't need.
arti-client = { version = "0.44", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "static-sqlite",
] }
tor-rtcompat = { version = "0.44", default-features = false, features = ["tokio", "rustls"] }
futures = "0.3"
# Surfaces arti's tracing output in logcat — without it a failure inside Tor
# is invisible on a phone.
android_logger = "0.14"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
