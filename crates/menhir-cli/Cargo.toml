[package]
name = "menhir-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "menhir — terminal Nostr text-channel client and relay admin, built for AI agents"

[[bin]]
name = "menhir"
path = "src/main.rs"

[dependencies]
menhir-core = { path = "../menhir-core", features = ["client"] }
menhir-relay = { path = "../menhir-relay" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
