[package]
name = "menhir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal Nostr protocol core for Obelisk Menhir: events, keys, filters, relay client"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
secp256k1.workspace = true
bech32.workspace = true
rand.workspace = true
thiserror.workspace = true

# client feature
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"], optional = true }
tokio-socks = { version = "0.5", optional = true }
futures-util = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
client = ["dep:tokio", "dep:tokio-tungstenite", "dep:tokio-socks", "dep:futures-util", "dep:tracing"]

[dev-dependencies]
tokio = { workspace = true }
