[workspace]
resolver = "2"
members = [
    "crates/menhir-core",
    "crates/menhir-relay",
    "crates/menhir-cli",
]
# The Tauri app (app/src-tauri) is intentionally NOT a workspace member:
# it cross-compiles for Android with its own lockfile and profile settings.

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/obelisk-app/obelisk-menhir"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["rand", "std"] }
bech32 = "0.11"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
